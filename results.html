<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gravity_falls_poll</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="results_styles.css">
  </head>
  <body>
    <div id="app">
      <div class="paper">
        <!-- Top-left tape + heart decoration -->
        <div class="tape-decoration">
          <img src="results/bandage.png" class="bandage" alt="">
          <img src="results/heart.png" class="heart" alt="">
        </div>

        <div class="paper-inner">
          <!-- Left column -->
          <div class="left-column">
            <div class="polaroid">
              <div class="photo-placeholder"></div>
              <div class="polaroid-caption">
                <span class="name"></span>
                <span class="date"></span>
              </div>
            </div>

            <div class="description"></div>
          </div>

          <!-- Right column -->
          <div class="right-column">
            <div class="doodles">
              <span class="doodle-line"></span>
              <span class="doodle-line"></span>
              <span class="doodle-line"></span>

              <p class="emoji emoji-axe">🪓</p>
              <p class="emoji emoji-tree">🌲</p>
              <p class="emoji emoji-radio">📻</p>
            </div>
          </div>
        </div>

        <div class="restart">Пройти еще раз</div>
      </div>

      <div class="debug"></div>
    </div>
    <script type="module" src="/src/count_results.ts"></script>
  </body>
</html>
